[package]
name = "remote-craft"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Thin terminal client for Omarchy boxes and coding agents over Tailscale"
license = "MIT"
repository = "https://github.com/ethereumdegen/remote-craft"

[[bin]]
name = "rcraft"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
crossterm = "0.29"
futures-util = "0.3"
keyring = "4"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "http2", "charset"] }
russh = "0.63"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
tui-term = "0.3"
unicode-width = "0.2"
vt100 = "0.16"
