# The Xcode project is generated from this file — run `xcodegen generate` before you
# build, and again after adding any file. The .xcodeproj is gitignored on purpose: a
# .pbxproj is a merge conflict waiting to happen and says nothing this file does not.
name: RemoteCraft
options:
  bundleIdPrefix: com.remotecraft
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # The terminal emulator. SwiftTerm ships a UIKit `TerminalView` and — despite what the
  # package's own sources suggest — **no usable SwiftUI wrapper**: the one in the box is
  # `internal` and `#if DEBUG`-gated, so it does not exist in a release build of the
  # package. Sources/Features/Terminal/TerminalSurface.swift is ours for that reason.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: 1.20.0
  # The SSH client. Chosen for three things nothing else on iOS gives at once: async/await
  # `withPTY`, OpenSSH private-key parsing, and a pluggable `SSHAuthenticationMethod` we
  # can hand a Secure Enclave key through.
  #
  # Supply-chain note, accepted knowingly: Citadel does not depend on Apple's
  # apple/swift-nio-ssh but on a third-party fork (`Wellz26/swift-nio-ssh`). That fork is
  # what carries the patches Citadel needs, and pinning Apple's upstream instead does not
  # build. Anyone auditing this app's dependencies should look at that fork, not only at
  # Citadel.
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: 0.12.1

settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "4"
    # 5.0, not 6.0: the app is a thin shell over two callback-shaped C-and-NIO libraries
    # (SwiftTerm's UIKit delegates, Citadel's channel handlers) that predate Sendable.
    # @MainActor isolation already gives us what strict concurrency would police here,
    # and @Observable works in either language mode.
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "SWLCQ3VGVF"

targets:
  RemoteCraft:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: SwiftTerm
      - package: Citadel
    info:
      # Written by XcodeGen from the properties below — it overwrites whatever is at
      # this path, so the file is generated and gitignored, and this block is the
      # source of truth. A generated-from-build-settings plist cannot express the
      # nested App Transport Security dictionary, which is why this target has a real
      # plist and not GENERATE_INFOPLIST_FILE.
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Remote Craft
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        # The app is dark by design, not "in dark mode" — a light-appearance system
        # must not repaint the canvas a terminal is drawn on.
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          # This applies to RELEASE too, deliberately. metalcraft-agent serves plain
          # HTTP on :3002 and has no certificate a phone would ever accept, and the
          # address we reach it on is usually a pinned `100.x` tailnet literal. ATS
          # applies to an IP literal exactly as it does to a hostname, it is not
          # bypassed by the traffic riding a utun interface, and an IP literal cannot
          # be written as an NSExceptionDomains entry. So without this the agent tab
          # simply fails on every TestFlight build while working in the simulator —
          # the worst possible shape for a bug.
          #
          # The exposure is bounded by what the transport already is: a tailnet is an
          # authenticated, encrypted, ACL'd network, and the shell half of the product
          # rides SSH with a pinned host key regardless of this setting.
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        # Export compliance, declared once here so App Store Connect stops
        # asking on every upload. The app is an SSH client, so it plainly uses
        # encryption — but it implements none of its own: swift-nio-ssh and
        # Citadel for SSH, URLSession for HTTPS, and the algorithms are the
        # published standard ones (Ed25519, ECDSA P-256, AES-GCM). That is the
        # exemption, and it is the same one other SSH clients on the store
        # declare. Revisit this if the app ever ships its own cryptography.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remotecraft.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"

  # Pure logic, no box: the SSE frame parser, the host-candidate fallback order, the
  # OpenSSH public-key wire encoding, the agent transcript reducer. Fast enough to run on
  # every change, and none of it needs a machine to ssh into.
  RemoteCraftTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/RemoteCraftTests
    dependencies:
      - target: RemoteCraft
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RemoteCraft:
    build:
      targets:
        RemoteCraft: all
        RemoteCraftTests: [test]
    test:
      targets:
        - RemoteCraftTests
    run:
      config: Debug
